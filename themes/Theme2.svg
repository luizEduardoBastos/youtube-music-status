<svg width="400" height="320" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml">
  <foreignObject width="400" height="320">
    <xhtml:div xmlns="http://www.w3.org/1999/xhtml">
      <xhtml:style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        .container {
          background: #0f0f14;
          border-radius: 16px;
          width: 400px;
          height: 320px;
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }
        .header {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 14px 16px 10px;
        }
        .yt-icon {
          width: 28px;
          height: 28px;
          background: #ff0000;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }
        .yt-icon svg { width: 14px; height: 14px; }
        .playing-label {
          color: #ffffff;
          font-size: 15px;
          font-weight: 600;
        }
        .thumbnail-wrapper {
          width: 100%;
          height: 170px;
          overflow: hidden;
          flex-shrink: 0;
        }
        .thumbnail-wrapper img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        .info {
          padding: 12px 16px 6px;
          flex: 1;
        }
        .artist {
          color: #ffffff;
          font-size: 15px;
          font-weight: 700;
          line-height: 1.3;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .song {
          color: #aaaaaa;
          font-size: 12px;
          margin-top: 2px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .bars-container {
          display: flex;
          align-items: flex-end;
          gap: 2px;
          padding: 6px 16px 14px;
          height: 48px;
        }
        .bar {
          background: #eb2121;
          bottom: 1px;
          height: 3px;
          position: relative;
          width: 5px;
          border-radius: 2px 2px 0 0;
          animation: sound 0ms -800ms linear infinite alternate;
        }
        @keyframes sound {
          0%   { height: 3px; }
          100% { height: 36px; }
        }
        .bar:nth-child(1)  { animation-duration: 474ms; }
        .bar:nth-child(2)  { animation-duration: 433ms; }
        .bar:nth-child(3)  { animation-duration: 407ms; }
        .bar:nth-child(4)  { animation-duration: 458ms; }
        .bar:nth-child(5)  { animation-duration: 400ms; }
        .bar:nth-child(6)  { animation-duration: 427ms; }
