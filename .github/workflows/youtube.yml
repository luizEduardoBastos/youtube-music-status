name: Update YouTube Music Card

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-card:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install colorthief firebase-admin Pillow python-dotenv requests ytmusicapi

      - name: Write Firebase credentials file
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: printf '%s' "$FIREBASE_CREDENTIALS_JSON" > firebase_credentials.json

      - name: Write YTMusic browser auth file
        env:
          YTMUSIC_BROWSER_JSON: ${{ secrets.YTMUSIC_BROWSER_JSON }}
        run: printf '%s' "$YTMUSIC_BROWSER_JSON" > ytmusic_browser.json

      # ------------------------------------------------------------------
      # DEBUG: confirma se os arquivos foram gravados corretamente.
      # Mostra o tamanho e as primeiras letras (sem expor a secret inteira).
      # Remova este step após confirmar que está funcionando.
      # ------------------------------------------------------------------
      - name: Debug credential files
        run: |
          echo "=== firebase_credentials.json ==="
          wc -c firebase_credentials.json
          head -c 30 firebase_credentials.json && echo ""

          echo "=== ytmusic_browser.json ==="
          wc -c ytmusic_browser.json
          head -c 30 ytmusic_browser.json && echo ""

          echo "=== Validar JSON ==="
          python -c "import json; json.load(open('firebase_credentials.json'))" && echo "Firebase JSON OK" || echo "Firebase JSON INVÁLIDO"
          python -c "import json; json.load(open('ytmusic_browser.json'))" && echo "YTMusic JSON OK" || echo "YTMusic JSON INVÁLIDO"

      - name: Run update script
        env:
          FIREBASE_CREDENTIALS: ./firebase_credentials.json
          FIREBASE_BUCKET:      ${{ secrets.FIREBASE_BUCKET }}
          YTMUSIC_BROWSER:      ./ytmusic_browser.json
        run: python update_card.py

      - name: Increment README cache-buster
        id: bump_version
        run: |
          current=$(grep -oP '(?<=alt=media&v=)\d+' README.md 2>/dev/null || echo "0")
          new=$((current + 1))
          sed -i "s/alt=media&v=${current}/alt=media\&v=${new}/" README.md
          echo "new_version=${new}" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: bump SVG cache-buster to v${{ steps.bump_version.outputs.new_version }}"
          git push
