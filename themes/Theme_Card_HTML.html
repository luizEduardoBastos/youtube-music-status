<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="460" height="110" viewBox="0 0 460 110">

  <defs>
    <style>
      @keyframes b1 { 0%,100% { transform: scaleY(0.22); } 50% { transform: scaleY(1); } }
      @keyframes b2 { 0%,100% { transform: scaleY(1);    } 50% { transform: scaleY(0.22); } }
      @keyframes b3 { 0%,100% { transform: scaleY(0.44); } 50% { transform: scaleY(1); } }
      @keyframes b4 { 0%,100% { transform: scaleY(1);    } 50% { transform: scaleY(0.28); } }

      .bar1, .bar2, .bar3, .bar4 {
        width: 4px;
        border-radius: 1px;
        flex-shrink: 0;
        align-self: flex-end;
      }
      .bar1 { height: 18px; background: #FF0000; animation: b1 0.65s ease-in-out infinite; }
      .bar2 { height: 18px; background: #FF0000; animation: b2 0.50s ease-in-out infinite; }
      .bar3 { height: 18px; background: #FF0000; animation: b3 0.80s ease-in-out infinite; }
      .bar4 { height: 18px; background: #FF0000; animation: b4 0.55s ease-in-out infinite; }

      @keyframes marquee {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
    </style>
  </defs>

  <foreignObject x="0" y="0" width="460" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml"
         style="margin:0; background:transparent; width:380px; box-sizing:content-box;">

      <div style="display:flex; align-items:center; margin-bottom:8px;">
        <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
          <rect width="20" height="20" rx="5" fill="#FF0000"/>
          <polygon points="7,5 7,15 16,10" fill="white"/>
        </svg>
        <div class="playing"
             style="margin-left:7px;
                    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
                    font-size:13px; font-weight:600; color:#d5d5d5;">Last music played</div>
      </div>

      <div style="display:flex; align-items:center;
                  border:1.5px solid #e4e2e2; border-radius:10px;
                  padding:8px 10px; box-sizing:border-box; width:380px; height:78px;">

        <div style="flex-shrink:0; width:60px; height:60px; border-radius:5px;
                    overflow:hidden; background:#2a2a2a;">
          <img class="thumb" src=""
               width="60" height="60"
               style="display:block; object-fit:cover;"
               alt="Album art"/>
        </div>

        <div style="margin-left:10px; flex:1; min-width:0;
                    display:flex; flex-direction:column; justify-content:center; gap:6px;">

          <div style="display:flex; align-items:flex-end; gap:3px; overflow:hidden;">
            <div style="display:flex; align-items:flex-end; gap:3px; flex-shrink:0;">
              <div class="bar1"></div>
              <div class="bar2"></div>
              <div class="bar3"></div>
              <div class="bar4"></div>
            </div>

            <div id="titleContainer"
                 style="overflow:hidden; white-space:nowrap; flex:1; min-width:0; margin-left:4px;">
              <span class="artist"
                    style="display:inline-block;
                           font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
                           font-size:14px; font-weight:700; color:#ffffff;"></span>
            </div>
          </div>

          <div class="song"
               style="overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
                      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
                      font-size:12px; color:#9e9e9e;"></div>

        </div>
      </div>
    </div>
  </foreignObject>
</svg>
